</header>

<main>

  <section id="contact" class="section">
    <div class="section-inner">
      <h2 class="section-title">Get In Touch</h2>

      <div class="contact-grid">
       
        <form class="contact-form" id="contact-form">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your name" required>

          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>

          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" placeholder="Say hello…" required></textarea>

          <button type="submit" class="btn btn-primary">Send Message</button>
          <p class="form-status" id="form-status" role="status"></p>
        </form>

        <div class="contact-social">
          <p>Or find me here:</p>
          <ul class="social-list">
            <li><a href="https://github.com/da-ne11" target="_blank" rel="noopener">GitHub ↗</a></li>
            <li><a href="https://www.facebook.com/share/1KgHhFGFfT/" target="_blank" rel="noopener">Facebook ↗</a></li>
            <li><a href="mailto:bubandaneharvy@gmail.com">Gmail ↗</a></li>
          </ul>
        </div>
      </div>
    </div>
  </section>

</main>
