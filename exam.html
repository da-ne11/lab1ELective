<!-- Image lightbox -->
<style>
  .lightbox{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;background:#000;padding:0;}
  .lightbox.open{display:flex;}
  .lightbox img{width:100vw;height:100vh;height:100dvh;object-fit:contain;display:block;border-radius:0;box-shadow:none;}
  .lightbox-close{position:fixed;top:16px;right:16px;z-index:10000;width:48px;height:48px;border:none;border-radius:50%;background:#fff;color:#111;font-size:30px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.6);}
  .lightbox-close:hover{background:#e5e5e5;}
</style>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image preview">
  <button class="lightbox-close" id="lightbox-close" aria-label="Close image">&times;</button>
  <img id="lightbox-img" src="" alt="">
</div>
<script>
(function () {
  var box = document.getElementById('lightbox');
  var img = document.getElementById('lightbox-img');
  function open(src, alt) { img.src = src; img.alt = alt || ''; box.classList.add('open'); document.body.style.overflow = 'hidden'; }
  function close() { box.classList.remove('open'); img.src = ''; document.body.style.overflow = ''; }
  document.querySelectorAll('.zoom-link').forEach(function (a) {
    a.addEventListener('click', function (e) {
      e.preventDefault();
      var im = a.querySelector('img');
      open(a.getAttribute('href'), im ? im.alt : '');
    });
  });
  document.getElementById('lightbox-close').addEventListener('click', close);
  box.addEventListener('click', function (e) { if (e.target === box) close(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
})();
</script>
